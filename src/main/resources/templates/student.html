<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Student</title>
</head>

<body>

	<h1>Student</h1>
	<form th:action="@{/students/add}"
      th:object="${student}"
      method="post">

		<label>ID:</label> <input type="number" th:field="*{id}"> <br>
		<br> <label>Name:</label> <input type="text" th:field="*{name}">

		<br>
		<br>

		<button type="submit">Save</button>

	</form>

	<br>

	<a th:href="@{/students/view}"> View Students </a>

</body>

</html>
