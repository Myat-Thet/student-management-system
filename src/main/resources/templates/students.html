<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Student List</title>
</head>

<body>

	<h1>Students</h1>

	<a th:href="@{/students}"> Add Student </a>

	<br>
	<br>

	<table border="1">

		<tr>
			<th>ID</th>
			<th>Name</th>
		</tr>

		<tr th:each="student : ${students}">

			<td th:text="${student.id}"></td>

			<td th:text="${student.name}"></td>

		</tr>

	</table>

</body>

</html>
